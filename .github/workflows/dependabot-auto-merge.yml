name: Dependabot auto-merge

on:
  workflow_call:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        id: metadata
        with:
          github-token: ${{ github.token }}
      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --squash --match-head-commit "$PR_HEAD" "$PR_URL"
      - name: Request maintainer review for major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        uses: actions/github-script@v9
        with:
          script: |
            const repo = context.repo;
            const issue_number = context.payload.pull_request.number;
            try {
              await github.rest.issues.createLabel({
                ...repo, name: 'needs-review', color: 'D93F0B',
                description: 'Requires maintainer review'
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            await github.rest.issues.addLabels({...repo, issue_number, labels: ['needs-review']});
            const marker = '<!-- dependabot-major-review -->';
            const body = `${marker}\nMajor update, waiting for a maintainer.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...repo, issue_number, per_page: 100
            });
            const previous = comments.find(item => item.user.login === 'github-actions[bot]' &&
              item.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({...repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...repo, issue_number, body});
            }
