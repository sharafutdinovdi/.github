name: Check failure hint

on:
  workflow_call:
    inputs:
      step-commands:
        description: JSON object mapping exact check step names to local reproduction commands.
        required: true
        type: string

permissions:
  actions: read
  pull-requests: write

concurrency:
  group: check-failure-comment-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  comment:
    if: >-
      github.event.pull_request &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Update failure hint
        uses: actions/github-script@v9
        env:
          STEP_COMMANDS: ${{ inputs.step-commands }}
        with:
          script: |
            const commands = JSON.parse(process.env.STEP_COMMANDS);
            if (!commands || Array.isArray(commands) || typeof commands !== 'object' ||
                Object.values(commands).some(value => typeof value !== 'string' || !value.trim())) {
              throw new Error('step-commands must map step names to nonempty command strings');
            }
            const repo = context.repo;
            const issue_number = context.payload.pull_request.number;
            const {data: pr} = await github.rest.pulls.get({...repo, pull_number: issue_number});
            if (pr.state !== 'open' || pr.head.sha !== context.payload.pull_request.head.sha) return;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...repo, run_id: context.runId, attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
              per_page: 100
            });
            const failed = jobs.flatMap(job => (job.steps || [])
              .filter(step => step.conclusion === 'failure')
              .map(step => ({job: job.name, name: step.name})));
            if (!failed.length) {
              core.warning('No failed steps are available from the jobs API.');
              return;
            }
            const marker = '<!-- check-failure-hint -->';
            const sections = failed.map(step => {
              const command = Object.hasOwn(commands, step.name) ? commands[step.name] : null;
              const heading = `### ${step.name} (${step.job})`;
              if (!command) return `${heading}\n\nNo local command is configured for this step. See the run log.`;
              const fence = '`'.repeat(Math.max(3, ...Array.from(command.matchAll(/`+/g), match => match[0].length + 1)));
              return `${heading}\n\n${fence}text\n${command}\n${fence}`;
            });
            const body = [marker, '## Checks failed',
              `[Run log](${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT})`,
              'Run these commands from the repository root after installing its documented prerequisites.',
              ...sections].join('\n\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...repo, issue_number, per_page: 100
            });
            const previous = comments.find(item => item.user.login === 'github-actions[bot]' &&
              item.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({...repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...repo, issue_number, body});
            }
